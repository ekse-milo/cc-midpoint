volumes:
  midpoint-db-a:
  midpoint-db-b:
  midpoint-db-c:

networks:
  midpoint-network:

services:
  # ==========================================
  # DATABASES
  # ==========================================
  mysql-db-a:
    image: mysql:8.0
    container_name: mysql-db-a
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: service_a_db
    ports:
      - "3306:3306"
    volumes:
      - midpoint-db-a:/var/lib/mysql
    networks:
      - midpoint-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-db-b:
    image: mysql:8.0
    container_name: mysql-db-b
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: service_b_db
    ports:
      - "3307:3306"
    volumes:
      - midpoint-db-b:/var/lib/mysql
    networks:
      - midpoint-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql-db-c:
    image: mysql:8.0
    container_name: mysql-db-c
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: service_c_db
    ports:
      - "3308:3306"
    volumes:
      - midpoint-db-c:/var/lib/mysql
    networks:
      - midpoint-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # MICROSERVICES
  # ==========================================
  service-a:
    build: ./service-a
    container_name: service-a
    ports:
      - "5001:5000"
    networks:
      - midpoint-network
    environment:
      - MYSQL_HOST=mysql-db-a
      - SERVICE_B_SYNC_URL=http://service-b:5000/sync
      - SERVICE_C_SYNC_URL=http://service-c:5000/sync
    depends_on:
      mysql-db-a:
        condition: service_healthy

  service-b:
    build: ./service-b
    container_name: service-b
    ports:
      - "5002:5000"
    networks:
      - midpoint-network
    environment:
      - MYSQL_HOST=mysql-db-b
      - SERVICE_A_SYNC_URL=http://service-a:5000/sync
      - SERVICE_C_SYNC_URL=http://service-c:5000/sync
    depends_on:
      mysql-db-b:
        condition: service_healthy

  service-c:
    build: ./service-c
    container_name: service-c
    ports:
      - "5003:5000"
    networks:
      - midpoint-network
    environment:
      - MYSQL_HOST=mysql-db-c
      - SERVICE_A_SYNC_URL=http://service-a:5000/sync
      - SERVICE_B_SYNC_URL=http://service-b:5000/sync
    depends_on:
      mysql-db-c:
        condition: service_healthy

  # ==========================================
  # API GATEWAY / FRONTEND
  # ==========================================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    networks:
      - midpoint-network
    environment:
      - SERVICE_A_URL=http://service-a:5000
      - SERVICE_B_URL=http://service-b:5000
      - SERVICE_C_URL=http://service-c:5000
    depends_on:
      - service-a
      - service-b
      - service-c